name: CFE Monitor

on:
  schedule:
    - cron: "0 16 * * *"  # 09:00 Tijuana aprox
    - cron: "0 19 * * *"  # 12:00 Tijuana aprox
    - cron: "0 22 * * *"  # 15:00 Tijuana aprox
    - cron: "0 1 * * *"   # 18:00 Tijuana aprox
    - cron: "0 3 * * *"   # 20:00 Tijuana aprox
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python cfe_monitor.py

      - name: Save state (commit cfe_state.json and counters)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cfe_state.json .runs_*.txt || true
          git commit -m "Update state [skip ci]" || echo "No changes to commit"
          git push || echo "No push (likely no changes)"

